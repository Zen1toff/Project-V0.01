<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Guy - IA Réelle Intégrée</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 20px; }
        h1, h2 { color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
        .api-box { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        .api-box input { background: #333; color: #fff; border: 1px solid #555; padding: 8px; width: 300px; border-radius: 4px; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .panel { flex: 1; min-width: 350px; background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #333; }
        .pnj-card { background: #252525; margin: 15px 0; padding: 15px; border-radius: 6px; border-left: 5px solid #00ffcc; position: relative; }
        .status-bubble { position: absolute; top: 10px; right: 10px; background: #333; padding: 3px 8px; font-size: 11px; border-radius: 10px; color: #ffcc00; }
        .log-box { background: #050505; color: #33ff33; font-family: 'Courier New', monospace; padding: 15px; height: 300px; overflow-y: scroll; border-radius: 4px; border: 1px solid #222; }
        button { background: #00ffcc; color: #000; border: none; padding: 12px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #00cca3; box-shadow: 0 0 10px rgba(0,255,204,0.5); }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        pre { background: #151515; padding: 10px; font-size: 11px; max-height: 150px; overflow-y: auto; color: #aaa; border-radius: 4px; }
        .thinking { color: #ff9900; font-style: italic; }
    </style>
</head>
<body>

    <h1>🎬 Free Guy : Simulation de PNJ avec Vraie IA</h1>
    
    <div class="api-box">
        <h3>🔑 Connexion au Cerveau de l'IA (Groq / Llama3)</h3>
        <p style="font-size: 13px; color: #aaa;">Crée un compte gratuit sur <a href="https://console.groq.com/" target="_blank" style="color: #00ffcc;">Groq Console</a> pour obtenir une clé API instantanément.</p>
        <input type="password" id="api-key" placeholder="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">
    </div>
    
    <div style="margin-bottom: 20px;">
        <button id="btn-sim" onclick="declencherInteractionia()">🤖 Lancer une Interaction IA en Direct</button>
    </div>

    <div class="container">
        <div class="panel">
            <h2>👥 Habitants Vivants (<span id="pop-count">0</span>)</h2>
            <div id="pnj-list"></div>
        </div>

        <div class="panel">
            <h2>📜 Flux de Conscience et Événements (IA)</h2>
            <div id="log-box" class="log-box"></div>
        </div>
    </div>

    <script>
        // --- BASE DE DONNÉES DE SAUVEGARDE DES PNJ ---
        // Ils se considèrent comme des humains au début
        let habitants = [
            {
                id: 1, name: "Guy", metier: "Banquier", 
                personnalite: "Optimiste, adore le café, poli, routinier.",
                conscience: "Pense être un humain normal à 100%.",
                memoire: ["A salué son meilleur ami Buddy ce matin."]
            },
            {
                id: 2, name: "Milly", metier: "Codeuse rebelle", 
                personnalite: "Curieuse, cherche la vérité, n'aime pas l'autorité.",
                conscience: "Sait que le monde cache quelque chose d'artificiel.",
                memoire: ["A remarqué un bug visuel dans le ciel hier."]
            }
        ];

        function log(text) {
            const lb = document.getElementById("log-box");
            lb.innerHTML += `<div>${text}</div>`;
            lb.scrollTop = lb.scrollHeight;
        }

        function rafraichirUI() {
            document.getElementById("pop-count").innerText = habitants.length;
            const list = document.getElementById("pnj-list");
            list.innerHTML = "";
            
            habitants.forEach(p => {
                list.innerHTML += `
                    <div class="pnj-card">
                        <div class="status-bubble">🧠 Conscience : ${p.conscience}</div>
                        <h3>🧑 ${p.name}</h3>
                        <p><strong>Métier :</strong> ${p.metier}</p>
                        <p><strong>Traits :</strong> <em>${p.personnalite}</em></p>
                        <details>
                            <summary>💾 Voir les données de sauvegarde du PNJ</summary>
                            <pre>${JSON.stringify(p, null, 2)}</pre>
                        </details>
                    </div>
                `;
            });
        }

      // --- APPEL À LA VRAIE IA ---
        async function appelerIA(systemPrompt, userPrompt) {
            const apiKey = document.getElementById("api-key").value.trim();
            if (!apiKey) {
                alert("⚠️ S'il te plaît, colle ta clé API Groq !");
                return null;
            }

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant", // Changement pour un modèle plus récent et stable
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: userPrompt }
                        ],
                        temperature: 0.8
                    })
                });

                const data = await response.json();
                
                // Si Groq renvoie une erreur textuelle
                if(data.error) {
                    console.error(data.error);
                    return "Erreur API : " + data.error.message;
                }

                return data.choices[0].message.content.trim();
            } catch (error) {
                console.error(error);
                return null;
            }
        }

        // --- SIMULATION DE L'INTERACTION PAR L'IA ---
        async function declencherInteractionia() {
            const btn = document.getElementById("btn-sim");
            btn.disabled = true;

            // On choisit les deux PNJ
            let p1 = habitants[0];
            let p2 = habitants[1];

            log(`<span class="thinking">[IA] Analyse du monde en cours... Génération d'une rencontre entre ${p1.name} et ${p2.name}...</span>`);

            // Événement déclencheur : Milly montre des lunettes de soleil à Guy
            let contexteAction = `Milly croise Guy dans la rue de Free City. Elle décide de briser sa routine en lui mettant de force des lunettes de soleil de joueur sur les yeux pour tester sa réaction.`;
            
            log(`🎬 <strong>Événement :</strong> ${contexteAction}`);

            // 1. Demander à l'IA la réaction de Guy
            let guySystem = `Tu es Guy, un PNJ qui vit dans un jeu vidéo mais qui est persuadé d'être un humain de chair et d'os. Ta personnalité : ${p1.personnalite}. Tes souvenirs récents : ${p1.memoire.join(' ')}. Tu dois réagir à ce qui t'arrive de manière ultra réaliste. Si l'action te fait réaliser que tu es dans un jeu, décris ta panique ou ta surprise existentielle en découvrant l'interface de code. Réponds sous forme de dialogue direct (court).`;
            
            let guyReponse = await appelerIA(guySystem, `Action actuelle : ${contexteAction}. Génère ta réaction orale.`);

            if (!guyReponse) {
                log(`❌ Échec de la connexion à l'IA. Vérifie ta clé API.`);
                btn.disabled = false;
                return;
            }

            log(`🗣️ <strong>${p1.name} :</strong> "${guyReponse}"`);
            p1.memoire.push(`Milly m'a mis des lunettes. J'ai vu des lignes de code flotter dans le ciel. Je panique.`);
            p1.conscience = "Prend conscience du code du jeu (50%)";

            // 2. Demander à l'IA la réponse de Milly
            let millySystem = `Tu es Milly, une codeuse humaine infiltrée. Ta personnalité : ${p2.personnalite}. Tu viens de mettre les lunettes à Guy et il vient de te répondre ceci : "${guyReponse}". Réponds-lui de manière naturelle, comme un humain parlerait à une IA qui s'éveille.`;
            
            let millyReponse = await appelerIA(millySystem, `Réponds à la réaction de Guy.`);
            
            log(`🗣️ <strong>${p2.name} :</strong> "${millyReponse}"`);
            p2.memoire.push(`J'ai mis les lunettes à Guy. Il commence à s'éveiller.`);

            log(`<span class="thinking">💾 [IA] Sauvegarde des mémoires terminée. Les personnalités ont évolué de manière autonome.</span>`);
            
            rafraichirUI();
            btn.disabled = false;
        }

        // Initialisation
        rafraichirUI();
    </script>
</body>
</html>
