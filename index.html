<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Guy - Simulation Réelle & IA Évolutive</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 20px; }
        h1, h2 { color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
        .api-box { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        .api-box input { background: #333; color: #fff; border: 1px solid #555; padding: 8px; width: 300px; border-radius: 4px; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .panel { flex: 1; min-width: 400px; background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #333; }
        #world-canvas { background: #1a1a1a; border: 2px solid #00ffcc; border-radius: 8px; display: block; box-shadow: 0 0 15px rgba(0,255,204,0.2); }
        .log-box { background: #050505; color: #33ff33; font-family: 'Courier New', monospace; padding: 15px; height: 280px; overflow-y: scroll; border-radius: 4px; border: 1px solid #222; font-size: 13px; margin-bottom: 15px; }
        .chat-box { background: #252525; padding: 15px; border-radius: 6px; border: 1px solid #444; }
        .chat-box select, .chat-box input { background: #333; color: #fff; border: 1px solid #555; padding: 10px; border-radius: 4px; }
        .chat-box input { width: 50%; }
        button { background: #00ffcc; color: #000; border: none; padding: 10px 15px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        button:hover { background: #00cca3; }
        .pnj-info { font-size: 12px; background: #2a2a2a; padding: 8px; margin-top: 5px; border-radius: 4px; border-left: 3px solid #00ffcc; }
    </style>
</head>
<body>

    <h1>🎬 Free Guy - Écosystème Urbain Dynamique</h1>
    
    <div class="api-box">
        <strong>🔑 Connexion Matrice (Clé API Groq) :</strong>
        <input type="password" id="api-key" placeholder="Colle ta clé gsk_... ici">
    </div>

    <div class="container">
        <div class="panel" style="flex: 1.3;">
            <h2>📺 Moniteur de la Ville (Vue Spectateur)</h2>
            <canvas id="world-canvas" width="600" height="400"></canvas>
        </div>

        <div class="panel">
            <h2>📜 Flux d'Événements & Conscience</h2>
            <div id="log-box" class="log-box"></div>
            
            <h2>💬 Donner un Ordre Libre (Mode Créateur)</h2>
            <div class="chat-box">
                <select id="chat-target">
                    <option value="Guy">Guy</option>
                    <option value="Milly">Milly</option>
                </select>
                <input type="text" id="chat-input" placeholder="Ex: Construis un grand jardin fleuri au milieu...">
                <button onclick="ordonnerActionLibre()">Soumettre l'ordre</button>
            </div>
            
            <div id="pnj-registry" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("world-canvas");
        const ctx = canvas.getContext("2d");

        // --- ÉLÉMENTS DE LA CARTE ---
        let structures = [
            { id: "maisonGuy", type: "building", x: 40, y: 40, w: 100, h: 70, color: "#1f3a52", nom: "🏠 Maison de Guy" },
            { id: "maisonMilly", type: "building", x: 460, y: 40, w: 100, h: 70, color: "#1f3a52", nom: "🏠 Maison de Milly" },
            { id: "banque", type: "building", x: 40, y: 290, w: 110, h: 80, color: "#2c3e50", nom: "🏦 Banque" },
            { id: "cafe", type: "building", x: 460, y: 290, w: 100, h: 80, color: "#7e512b", nom: "☕ Café Central" }
        ];

        let voitures = [
            { x: 10, y: 192, vitesse: 2.5, couleur: "#d63031" },
            { x: 550, y: 215, vitesse: -2, couleur: "#f1c40f" }
        ];

        // --- LES HABITANTS (Avec coordonnées logiques et IA) ---
        let habitants = [
            { name: "Guy", color: "#00ffcc", x: 90, y: 110, targetX: 90, targetY: 110, statut: "En déplacement", routineTimer: 0, tacheSpeciale: null, conscience: "Suit sa routine" },
            { name: "Milly", color: "#ff00ff", x: 510, y: 110, targetX: 510, targetY: 110, statut: "En déplacement", routineTimer: 0, tacheSpeciale: null, conscience: "Analyse le monde" }
        ];

        function log(text) {
            const lb = document.getElementById("log-box");
            lb.innerHTML += `<div>${text}</div>`;
            lb.scrollTop = lb.scrollHeight;
        }

        // --- BOUCLE PRINCIPALE DE JEU (60 FPS) ---
        function drawWorld() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Dessin des Rues
            ctx.fillStyle = "#2d3436";
            ctx.fillRect(0, 180, 600, 50); // Route horizontale
            
            // Lignes de signalisation routière
            ctx.fillStyle = "#ffffff";
            for(let i = 0; i < 600; i += 40) {
                ctx.fillRect(i, 204, 20, 2);
            }

            // Passage piéton au centre
            for(let j = 180; j < 230; j += 10) {
                ctx.fillRect(290, j, 20, 5);
            }

            // 2. Dessin des Structures & Projets Générés par l'IA
            structures.forEach(s => {
                ctx.fillStyle = s.color;
                ctx.fillRect(s.x, s.y, s.w, s.h);
                ctx.strokeStyle = "#00ffcc";
                ctx.lineWidth = 1;
                ctx.strokeRect(s.x, s.y, s.w, s.h);
                
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 11px Arial";
                ctx.fillText(s.nom, s.x + 8, s.y + 25);

                // Si c'est un jardin généré, dessiner des petites fleurs
                if (s.type === "garden") {
                    ctx.fillStyle = "#e84393";
                    ctx.fillRect(s.x + 10, s.y + 40, 6, 6);
                    ctx.fillStyle = "#f1c40f";
                    ctx.fillRect(s.x + 35, s.y + 45, 6, 6);
                }
            });

            // 3. Déplacement des Voitures
            voitures.forEach(v => {
                v.x += v.vitesse;
                if (v.vitesse > 0 && v.x > 600) v.x = -50;
                if (v.vitesse < 0 && v.x < -50) v.x = 600;
                
                ctx.fillStyle = v.color;
                ctx.fillRect(v.x, v.y, 45, 18);
                // Pare-brise
                ctx.fillStyle = "#74b9ff";
                if(v.vitesse > 0) ctx.fillRect(v.x + 30, v.y + 3, 10, 12);
                else ctx.fillRect(v.x + 5, v.y + 3, 10, 12);
            });

            // 4. Déplacement et Comportement des PNJ
            habitants.forEach(p => {
                // Gestion des tâches spéciales envoyées par l'IA (Ex: Construire un jardin)
                if (p.tacheSpeciale) {
                    let task = p.tacheSpeciale;
                    let dx = task.x - p.x;
                    let dy = task.y - p.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist > 8) {
                        p.statut = "Se rend sur le chantier";
                        p.x += (dx / dist) * 2;
                        p.y += (dy / dist) * 2;
                    } else {
                        p.statut = "Construction en cours...";
                        task.progression += 0.4; // Vitesse de construction

                        // Rendu visuel immédiat des fondations en transparence pendant qu'il construit
                        ctx.fillStyle = "rgba(46, 204, 113, 0.3)";
                        ctx.fillRect(task.x - 30, task.y - 25, 80, 60);

                        if (task.progression >= 100) {
                            structures.push({
                                id: task.id,
                                type: "garden",
                                x: task.x - 30,
                                y: task.y - 25,
                                w: 80,
                                h: 60,
                                color: "#27ae60", // Vert herbe
                                nom: task.nomObjet
                            });
                            log(`🛠️ <strong>[Système]</strong> : ${p.name} a terminé la création de : "${task.nomObjet}" !`);
                            p.tacheSpeciale = null;
                            p.statut = "Se repose";
                        }
                    }
                } else {
                    // Autonomie permanente par défaut (Plus de blocage !)
                    let dx = p.targetX - p.x;
                    let dy = p.targetY - p.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist > 5) {
                        p.statut = "En déplacement";
                        p.x += (dx / dist) * 1.5;
                        p.y += (dy / dist) * 1.5;
                    } else {
                        p.statut = "Vaque à ses occupations";
                        p.routineTimer++;
                        
                        // Toutes les quelques secondes, il choisit un nouvel endroit logique où aller
                        if (p.routineTimer > 180) { 
                            let cibleAleatoire = structures[Math.floor(Math.random() * structures.length)];
                            p.targetX = cibleAleatoire.x + (cibleAleatoire.w / 2);
                            p.targetY = cibleAleatoire.y + (cibleAleatoire.h / 2);
                            p.routineTimer = 0;
                        }
                    }
                }

                // --- RENDU GRAPHIQUE DES PNJ (Bien visibles) ---
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.stroke();

                // Lettre du prénom au centre du personnage
                ctx.fillStyle = "#121212";
                ctx.font = "bold 12px Arial";
                ctx.fillText(p.name[0], p.x - 4, p.y + 4);

                // Informations au-dessus de la tête
                ctx.fillStyle = "#ffffff";
                ctx.font = "10px Arial";
                ctx.fillText(p.name, p.x - 12, p.y - 30);
                ctx.fillStyle = "#00ffcc";
                ctx.fillText(p.statut, p.x - 25, p.y - 18);

                // Affichage visuel de la jauge de progression pour les ordres libres
                if (p.tacheSpeciale) {
                    ctx.fillStyle = "#7f8c8d";
                    ctx.fillRect(p.x - 20, p.y + 16, 40, 5);
                    ctx.fillStyle = "#2ecc71";
                    ctx.fillRect(p.x - 20, p.y + 16, (p.tacheSpeciale.progression / 100) * 40, 5);
                }
            });

            updateRegistry();
            requestAnimationFrame(drawWorld);
        }

        // --- APPEL DE L'INTELLIGENCE ARTIFICIELLE ---
        async function appelerIA(systemPrompt, userPrompt) {
            const apiKey = document.getElementById("api-key").value.trim();
            if (!apiKey) {
                alert("⚠️ N'oublie pas de coller ta clé API Groq en haut !");
                return null;
            }

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant",
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: userPrompt }
                        ],
                        temperature: 0.2,
                        response_format: { type: "json_object" } // Force un retour au format JSON valide
                    })
                });
                const data = await response.json();
                return JSON.parse(data.choices[0].message.content.trim());
            } catch (error) {
                console.error(error);
                return null;
            }
        }

        // --- ENVOI ET TRADUCTION DE L'ORDRE PAR L'IA ---
        async function ordonnerActionLibre() {
            const targetName = document.getElementById("chat-target").value;
            const textInput = document.getElementById("chat-input").value.trim();
            if(!textInput) return;

            let pnj = habitants.find(h => h.name === targetName);
            log(`<span style="color:#00ffcc;">⚡ <strong>[Ordre Créateur] à ${pnj.name} :</strong> "${textInput}"</span>`);
            document.getElementById("chat-input").value = "";

            let systemInstruction = `Tu es l'esprit de décision de ${pnj.name} dans une simulation évolutive. L'utilisateur te donne un ordre de modification du monde libre. Tu dois impérativement générer une réponse au format JSON contenant :
            1. "action": "construire" s'il veut créer quelque chose (jardin, parc, mur), sinon "marcher".
            2. "phrase": Ce que tu réponds à haute voix face à cet ordre.
            3. "x": Une coordonnée X cible logique sur la carte (choisis entre 150 et 450 pour éviter le bord).
            4. "y": Une coordonnée Y cible logique sur la carte (choisis entre 100 et 350, évite la route à 180-230).
            5. "nomObjet": Le nom de la structure que tu vas bâtir (ex: "Jardin Secret de Guy").`;

            log(`<span style="color:orange;">🧠 [IA Matrix] Interprétation des données en cours...</span>`);

            let simulationData = await appelerIA(systemInstruction, textInput);

            if(simulationData) {
                log(`🗣️ <strong>${pnj.name} :</strong> "${simulationData.phrase}"`);
                pnj.conscience = "Exécute un ordre divin";

                if (simulationData.action === "construire") {
                    pnj.tacheSpeciale = {
                        id: "struct_" + Date.now(),
                        nomObjet: simulationData.nomObjet || "Zone Créée",
                        x: simulationData.x,
                        y: simulationData.y,
                        progression: 0
                    };
                } else {
                    pnj.targetX = simulationData.x;
                    pnj.targetY = simulationData.y;
                }
            } else {
                log(`<span style="color:red;">❌ Échec de la communication IA. Vérifie ta clé ou le format.</span>`);
            }
        }

        function updateRegistry() {
            const reg = document.getElementById("pnj-registry");
            reg.innerHTML = "";
            habitants.forEach(p => {
                reg.innerHTML += `
                    <div class="pnj-info">
                        <strong>🧑 Nom : ${p.name}</strong> | Position : (${Math.round(p.x)}, ${Math.round(p.y)})<br>
                        ⚙️ État Moteur : <span style="color:#00ffcc">${p.statut}</span><br>
                        🧠 Niveau Conscience : <em>${p.conscience}</em>
                    </div>
                `;
            });
        }

        // Lancement initial automatique
        log("Système initialisé. Les citoyens s'activent de façon autonome.");
        drawWorld();
    </script>
</body>
</html>
