<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Guy - IA Générative de Monde</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 20px; }
        h1, h2 { color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
        .api-box { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        .api-box input { background: #333; color: #fff; border: 1px solid #555; padding: 8px; width: 250px; border-radius: 4px; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .panel { flex: 1; min-width: 400px; background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #333; }
        #world-canvas { background: #1a1a1a; border: 2px solid #00ffcc; border-radius: 8px; display: block; box-shadow: 0 0 15px rgba(0,255,204,0.2); }
        .log-box { background: #050505; color: #33ff33; font-family: 'Courier New', monospace; padding: 15px; height: 250px; overflow-y: scroll; border-radius: 4px; border: 1px solid #222; font-size: 13px; margin-bottom: 15px; }
        .chat-box { background: #252525; padding: 15px; border-radius: 6px; border: 1px solid #444; }
        .chat-box select, .chat-box input { background: #333; color: #fff; border: 1px solid #555; padding: 10px; border-radius: 4px; }
        .chat-box input { width: 50%; }
        button { background: #00ffcc; color: #000; border: none; padding: 10px 15px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .pnj-info { font-size: 12px; background: #2a2a2a; padding: 8px; margin-top: 5px; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>🎬 Free Guy - Simulation IA Évolutive Infinie</h1>
    
    <div class="api-box">
        <strong>🔑 Clé API Groq :</strong>
        <input type="password" id="api-key" placeholder="Colle ta clé gsk_... ici">
    </div>

    <div class="container">
        <div class="panel" style="flex: 1.3;">
            <h2>📺 Moniteur de la Matrice (Objets et PNJ Visibles)</h2>
            <canvas id="world-canvas" width="600" height="400"></canvas>
        </div>

        <div class="panel">
            <h2>📜 Flux de Conscience Collectif</h2>
            <div id="log-box" class="log-box"></div>
            
            <h2>💬 Donner un Ordre Libre (Mode Dieu)</h2>
            <div class="chat-box">
                <select id="chat-target">
                    <option value="Guy">Guy</option>
                    <option value="Milly">Milly</option>
                </select>
                <input type="text" id="chat-input" placeholder="Ex: Crée un jardin fleuri au centre-ville...">
                <button onclick="ordonnerActionLibre()">Soumettre l'ordre</button>
            </div>
            
            <div id="pnj-registry" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("world-canvas");
        const ctx = canvas.getContext("2d");

        // --- STRUCTURES DYNAMIQUES DE LA VILLE ---
        let structures = [
            { id: "maisonGuy", type: "building", x: 40, y: 40, w: 90, h: 70, color: "#2e4a62", nom: "Maison de Guy" },
            { id: "maisonMilly", type: "building", x: 470, y: 40, w: 90, h: 70, color: "#2e4a62", nom: "Maison de Milly" },
            { id: "banque", type: "building", x: 40, y: 290, w: 110, h: 80, color: "#3a3a3a", nom: "🏦 Banque" }
        ];

        let voitures = [
            { x: 0, y: 195, vitesse: 2, couleur: "#ff3333" },
            { x: 600, y: 215, vitesse: -1.5, couleur: "#ffcc00" }
        ];

        let habitants = [
            { name: "Guy", color: "#00ffcc", x: 85, y: 110, targetX: 85, targetY: 110, statut: "En attente", memoire: "Prêt", tacheSpeciale: null },
            { name: "Milly", color: "#ff00ff", x: 515, y: 110, targetX: 515, targetY: 110, statut: "En attente", memoire: "Prête", tacheSpeciale: null }
        ];

        // --- MOTEUR DE RENDU GRAPHIQUE ---
        function simulationStep() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Rues
            ctx.fillStyle = "#222";
            ctx.fillRect(0, 180, 600, 50);
            ctx.fillStyle = "#ffcc00";
            for(let i=0; i<600; i+=30) ctx.fillRect(i, 204, 15, 2);

            // Dessiner les structures existantes (Bâtiments et nouvelles constructions comme les jardins)
            structures.forEach(s => {
                ctx.fillStyle = s.color;
                ctx.fillRect(s.x, s.y, s.w, s.h);
                ctx.strokeStyle = "#4a90e2";
                ctx.strokeRect(s.x, s.y, s.w, s.h);
                ctx.fillStyle = "#fff";
                ctx.font = "11px Arial";
                ctx.fillText(s.nom, s.x + 5, s.y + 20);
            });

            // Voitures
            voitures.forEach(v => {
                v.x += v.vitesse;
                if (v.vitesse > 0 && v.x > 600) v.x = -40;
                if (v.vitesse < 0 && v.x < -40) v.x = 600;
                ctx.fillStyle = v.color;
                ctx.fillRect(v.x, v.y, 40, 16);
            });

            // Gestion et dessin des PNJ (Visibles)
            habitants.forEach(p => {
                // Gestion des tâches spéciales ordonnées (ex: Construire un jardin)
                if (p.tacheSpeciale) {
                    let t = p.tacheSpeciale;
                    let dx = t.x - p.x;
                    let dy = t.y - p.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);

                    if (dist > 5) {
                        p.statut = "S'occupe de la tâche : " + t.nom;
                        p.x += (dx / dist) * 1.5;
                        p.y += (dy / dist) * 1.5;
                    } else {
                        p.statut = "En train de générer : " + t.nom;
                        t.progression += 0.2; // Avancée des travaux
                        
                        // Si l'IA a ordonné une création, on injecte visuellement l'objet dans le monde !
                        if (t.progression >= 100 && !structures.some(s => s.id === t.id)) {
                            structures.push({
                                id: t.id,
                                type: "garden",
                                x: t.x - 25,
                                y: t.y - 25,
                                w: 60,
                                h: 60,
                                color: "#228b22", // Vert herbe pour le jardin !
                                nom: "🌻 " + t.nom
                            });
                            p.tacheSpeciale = null;
                            p.statut = "Tâche terminée !";
                        }
                    }
                } else {
                    // Routine par défaut si aucune tâche spéciale
                    let dx = p.targetX - p.x; let dy = p.targetY - p.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist > 5) {
                        p.x += (dx / dist) * 1; p.y += (dy / dist) * 1;
                    } else if (Math.random() > 0.99) {
                        p.targetX = Math.random() * 500 + 50;
                        p.targetY = Math.random() * 300 + 50;
                    }
                }

                // --- DESSIN DU PNJ PHYSIQUE ---
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 12, 0, Math.PI * 2); // Un cercle plus grand pour bien les voir
                ctx.fill();
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 2;
                ctx.stroke();

                // Initiales à l'intérieur du PNJ
                ctx.fillStyle = "#000";
                ctx.font = "bold 11px Arial";
                ctx.fillText(p.name[0], p.x - 4, p.y + 4);

                // Étiquette Nom et Statut au-dessus
                ctx.fillStyle = "#fff";
                ctx.font = "10px Arial";
                ctx.fillText(p.name + " (" + Math.round(p.x) + "," + Math.round(p.y) + ")", p.x - 20, p.y - 28);
                
                // Barre de progression si le PNJ construit quelque chose
                if (p.tacheSpeciale) {
                    ctx.fillStyle = "#555"; ctx.fillRect(p.x - 20, p.y - 20, 40, 5);
                    ctx.fillStyle = "#00ff00"; ctx.fillRect(p.x - 20, p.y - 20, (p.tacheSpeciale.progression / 100) * 40, 5);
                }
            });

            updateRegistryUI();
            requestAnimationFrame(simulationStep);
        }

        // --- CONNEXION DE CONSCIENCE IA ---
        async function appelerCerveauIA(systemPrompt, userPrompt) {
            const apiKey = document.getElementById("api-key").value.trim();
            if (!apiKey) return JSON.stringify({ action: "parler", texte: "Active ma clé API pour que je puisse analyser ton ordre !", x: 0, y: 0, nomObjet: "" });

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant",
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: userPrompt }
                        ],
                        temperature: 0.3, // Température basse pour forcer un format JSON strict
                        response_format: { type: "json_object" } // On demande obligatoirement du JSON
                    })
                });
                const data = await response.json();
                return data.choices[0].message.content.trim();
            } catch (error) {
                return null;
            }
        }

        // --- INTERPRÉTATION DE L'ORDRE DU JOUEUR ---
        async function ordonnerActionLibre() {
            const pnjNom = document.getElementById("chat-target").value;
            const promptUtilisateur = document.getElementById("chat-input").value.trim();
            if(!promptUtilisateur) return;

            let pnj = habitants.find(h => h.name === pnjNom);
            const lb = document.getElementById("log-box");
            lb.innerHTML += `<div style="color:#00ffcc;">⚡ <strong>[Ordre Divin] à ${pnj.name} :</strong> "${promptUtilisateur}"</div>`;
            document.getElementById("chat-input").value = "";

            // Le prompt système force l'IA à renvoyer des coordonnées mathématiques et un plan d'action pour le moteur de jeu
            let systemInstruction = `Tu es l'esprit logique de ${pnj.name}. L'utilisateur te demande de faire une action qui n'est peut-être pas codée à l'avance. Tu as le pouvoir de modifier l'environnement. Tu dois renvoyer UN OBJET JSON STRICT contenant exactement ces 4 clés :
            1. "action": soit "construire" (si l'ordre implique de créer un espace, jardin, structure), soit "marcher"
            2. "texte": Ta réponse verbale face à cet ordre
            3. "targetX": Une coordonnée X idéale entre 100 et 500 pour accomplir l'action
            4. "targetY": Une coordonnée Y idéale entre 80 et 300 pour accomplir l'action
            5. "nomObjet": Le nom de la structure créée (ex: "Jardin de Guy") s'il s'agit d'une construction.
            Ne renvoie aucun texte avant ou après le JSON.`;

            lb.innerHTML += `<div class="thinking">🧠 [IA Matrix] Traitement de l'ordre en cours... Apprentissage des nouvelles règles...</div>`;
            lb.scrollTop = lb.scrollHeight;

            let iaResultatTexte = await appelerCerveauIA(systemInstruction, promptUtilisateur);
            
            try {
                let idData = JSON.parse(iaResultatTexte);
                lb.innerHTML += `<div>🗣️ <strong>${pnj.name} :</strong> "${idData.texte}"</div>`;
                
                if (idData.action === "construire") {
                    pnj.tacheSpeciale = {
                        id: "dyn_" + Date.now(),
                        nom: idData.nomObjet || "Nouvelle Zone",
                        x: idData.targetX,
                        y: idData.targetY,
                        progression: 0
                    };
                    lb.innerHTML += `<div style="color:#ffcc00;">🔨 ${pnj.name} se dirige vers (${idData.targetX}, ${idData.targetY}) pour bâtir : ${idData.nomObjet}</div>`;
                } else {
                    pnj.targetX = idData.targetX;
                    pnj.targetY = idData.targetY;
                }
            } catch(e) {
                lb.innerHTML += `<div style="color:red;">❌ L'IA a rencontré une erreur de compilation pour cette action complexe.</div>`;
            }
            lb.scrollTop = lb.scrollHeight;
        }

        function updateRegistryUI() {
            const reg = document.getElementById("pnj-registry");
            reg.innerHTML = "";
            habitants.forEach(p => {
                reg.innerHTML += `
                    <div class="pnj-info">
                        <strong>🧑 PNJ : ${p.name}</strong> | Position: (${Math.round(p.x)}, ${Math.round(p.y)})<br>
                        🎯 Statut moteur : <span style="color:#00ffcc">${p.statut}</span>
                    </div>
                `;
            });
        }

        // Lancement immédiat
        simulationStep();
    </script>
</body>
</html>
